<script>
(function () {
  'use strict';

  var statusEl = document.getElementById('status');
  function fail(msg) { statusEl.hidden = false; statusEl.textContent = msg; }

  if (typeof THREE === 'undefined' || !THREE.OrbitControls) {
    fail('Não foi possível carregar a biblioteca 3D (Three.js). Verifique a conexão com a internet e recarregue a página.');
    return;
  }

  // ---------------------------------------------------------------------------
  // Dados da planta e conversão pixel -> metro
  // ---------------------------------------------------------------------------
  var L = JSON.parse(document.getElementById('layout-data').textContent);
  var S = L.meta.pxPerMeter;
  var HT = L.meta.heights;
  var B = L.meta.bounds;
  var CX = (B[0] + B[2]) / 2, CY = (B[1] + B[3]) / 2;
  var W = (B[2] - B[0]) / S, D = (B[3] - B[1]) / S;
  function X(u) { return (u - CX) / S; }
  function Z(v) { return (v - CY) / S; }

  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Pseudo-aleatório determinístico: o modelo fica igual a cada carregamento
  var seed = 20260928;
  function rnd() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }

  // ---------------------------------------------------------------------------
  // Paletas (claro / escuro)
  // ---------------------------------------------------------------------------
  var PALETTES = {
    light: {
      slab: 0xf7f7f5, slabSide: 0xd5d9de, grid: 0xc9cfd6, wall: 0xd9d6cf, officeWall: 0xead7a4,
      partition: 0xb9bec6, enclosure: 0xc3c7cd, column: 0xc4c8ce, upright: 0x2f55d4, beam: 0xe8a317,
      palletWood: 0xb58b58, desk: 0xfbfbfa, bench: 0xc4ccd6, sofa: 0x9aa6b8, stair: 0xd2d6db,
      person: 0xf2c230, personHead: 0x2b3440, forklift: 0xf08c00, forkliftDark: 0x2b3440,
      path: 0x178a4c, pathMark: '#ffffff', room: 0xf3eee5, zoneEdge: 0x7d8794, highlight: 0x2f55d4,
      loads: [0xcfb893, 0xc4ab84, 0xd8c6a6, 0xbca078, 0xc9b28e],
      tints: { storage: 0xe2e8f4, danger: 0xf6dada, ship: 0xdbeee2, neutral: 0xe2e4e7, sort: 0xdce6f8, test: 0xf8eacf, office: 0xe5e8ef, receive: 0xeae1f5 }
    },
    dark: {
      slab: 0x1f252d, slabSide: 0x2a323c, grid: 0x303844, wall: 0x3a424d, officeWall: 0x8c7442,
      partition: 0x5a6472, enclosure: 0x4a525e, column: 0x4a525e, upright: 0x5b7cf0, beam: 0xe0a02a,
      palletWood: 0x8a6a43, desk: 0x444c57, bench: 0x4a5563, sofa: 0x566278, stair: 0x3e4651,
      person: 0xf2c230, personHead: 0xd9dee5, forklift: 0xf08c00, forkliftDark: 0x151a20,
      path: 0x2fb86a, pathMark: '#e9fff2', room: 0x29303a, zoneEdge: 0x6b7686, highlight: 0x9db4ff,
      loads: [0xa89479, 0x9c8869, 0xb5a285, 0x8f7b5e, 0xa18c6f],
      tints: { storage: 0x202a3a, danger: 0x3b2427, ship: 0x1f3429, neutral: 0x272c33, sort: 0x1f2d44, test: 0x3a3022, office: 0x262c37, receive: 0x2f2742 }
    }
  };
  function currentTheme() {
    var t = document.documentElement.getAttribute('data-theme');
    if (t === 'dark' || t === 'light') return t;
    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  var P = PALETTES[currentTheme()];

  // ---------------------------------------------------------------------------
  // Renderizador, câmera e controles
  // ---------------------------------------------------------------------------
  var canvas = document.getElementById('scene');
  var renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  } catch (e) {
    fail('Este navegador não conseguiu iniciar o WebGL, necessário para o modelo 3D.');
    return;
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(40, 1, 0.1, 600);
  var controls = new THREE.OrbitControls(camera, canvas);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.maxPolarAngle = Math.PI * 0.49;
  controls.minDistance = 3;
  controls.maxDistance = 170;
  controls.screenSpacePanning = false;

  var hemi = new THREE.HemisphereLight(0xffffff, 0xcfd3da, 0.66);
  scene.add(hemi);
  var sun = new THREE.DirectionalLight(0xffffff, 0.66);
  sun.position.set(24, 48, 20);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -34; sun.shadow.camera.right = 34;
  sun.shadow.camera.top = 34; sun.shadow.camera.bottom = -34;
  sun.shadow.camera.near = 1; sun.shadow.camera.far = 140;
  sun.shadow.bias = -0.0004;
  sun.shadow.normalBias = 0.03;
  scene.add(sun);
  scene.add(sun.target);

  // ---------------------------------------------------------------------------
  // Materiais (recoloridos quando o tema muda)
  // ---------------------------------------------------------------------------
  var MAT = {};
  function std(key, extra) {
    var m = new THREE.MeshStandardMaterial(Object.assign({ color: P[key], roughness: 0.92, metalness: 0 }, extra || {}));
    m.userData.key = key;
    MAT[key] = m;
    return m;
  }
  ['slab', 'slabSide', 'wall', 'officeWall', 'partition', 'enclosure', 'column', 'upright', 'beam',
   'palletWood', 'desk', 'bench', 'sofa', 'stair', 'person', 'personHead', 'forklift', 'forkliftDark'
  ].forEach(function (k) { std(k); });
  MAT.upright.roughness = 0.6; MAT.upright.metalness = 0.15;
  MAT.beam.roughness = 0.6; MAT.beam.metalness = 0.1;
  std('room', { polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -1 });
  var loadMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.95 });
  var tintMats = {};
  Object.keys(P.tints).forEach(function (k) {
    tintMats[k] = new THREE.MeshStandardMaterial({ color: P.tints[k], roughness: 1, polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -1 });
  });
  var zoneEdgeMat = new THREE.LineDashedMaterial({ color: P.zoneEdge, dashSize: 0.5, gapSize: 0.35, transparent: true, opacity: 0.8 });
  var gridMat = new THREE.LineBasicMaterial({ color: P.grid });
  var hitMat = new THREE.MeshBasicMaterial({ visible: false });

  // Textura do caminho seguro: faixa verde com bordas e tracejado central
  var pathCanvas = document.createElement('canvas');
  pathCanvas.width = 128; pathCanvas.height = 64;
  function drawPathTexture() {
    var g = pathCanvas.getContext('2d');
    g.fillStyle = '#' + new THREE.Color(P.path).getHexString();
    g.fillRect(0, 0, 128, 64);
    g.fillStyle = P.pathMark;
    g.fillRect(0, 0, 128, 5);
    g.fillRect(0, 59, 128, 5);
    g.fillRect(0, 29, 64, 6);
  }
  drawPathTexture();
  var pathTex = new THREE.CanvasTexture(pathCanvas);
  pathTex.wrapS = THREE.RepeatWrapping;
  pathTex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  var pathCornerMat = new THREE.MeshStandardMaterial({ color: P.path, roughness: 0.8, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 });

  // ---------------------------------------------------------------------------
  // Grupos (camadas)
  // ---------------------------------------------------------------------------
  var G = {};
  ['structure', 'racks', 'pallets', 'path', 'zones', 'offices', 'furniture', 'actors'].forEach(function (k) {
    G[k] = new THREE.Group(); G[k].name = k; scene.add(G[k]);
  });

  var boxGeo = new THREE.BoxGeometry(1, 1, 1);
  boxGeo.translate(0, 0.5, 0); // base apoiada em y = 0
  var planeGeo = new THREE.PlaneGeometry(1, 1);
  planeGeo.rotateX(-Math.PI / 2);

  function box(mat, x0, z0, x1, z1, y0, h, group) {
    var m = new THREE.Mesh(boxGeo, mat);
    m.scale.set(Math.max(Math.abs(x1 - x0), 0.01), h, Math.max(Math.abs(z1 - z0), 0.01));
    m.position.set((x0 + x1) / 2, y0, (z0 + z1) / 2);
    m.castShadow = true; m.receiveShadow = true;
    group.add(m);
    return m;
  }
  function boxPx(mat, r, y0, h, group) { return box(mat, X(r[0]), Z(r[1]), X(r[2]), Z(r[3]), y0, h, group); }

  var pickables = [];
  function makePickable(obj, title, info, focus) {
    obj.userData.title = title;
    obj.userData.info = info || '';
    obj.userData.focus = focus || null;
    pickables.push(obj);
  }

  // ---------------------------------------------------------------------------
  // Piso, eixos estruturais e sombra
  // ---------------------------------------------------------------------------
  var slab = box(MAT.slabSide, -W / 2 - 0.4, -D / 2 - 0.4, W / 2 + 0.4, D / 2 + 0.4, -0.35, 0.34, G.structure);
  slab.castShadow = false;
  var floor = new THREE.Mesh(planeGeo, MAT.slab);
  floor.scale.set(W, 1, D);
  floor.position.y = -0.005;
  floor.receiveShadow = true;
  G.structure.add(floor);

  var shadowCatcher = new THREE.Mesh(new THREE.PlaneGeometry(400, 400).rotateX(-Math.PI / 2), new THREE.ShadowMaterial({ opacity: 0.1 }));
  shadowCatcher.position.y = -0.36;
  shadowCatcher.receiveShadow = true;
  scene.add(shadowCatcher);

  (function axes() {
    var us = [66, 657, 1241, 1828, 2415], vs = [286, 873, 1460, 2047, 2634, 3222], pts = [];
    us.forEach(function (u) { pts.push(X(u), 0.004, Z(B[1]), X(u), 0.004, Z(B[3])); });
    vs.forEach(function (v) { pts.push(X(B[0]), 0.004, Z(v), X(B[2]), 0.004, Z(v)); });
    var g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
    G.structure.add(new THREE.LineSegments(g, gridMat));
  })();

  // ---------------------------------------------------------------------------
  // Paredes e pilares
  // ---------------------------------------------------------------------------
  var tallables = [];
  function wall(seg, thick, h, mat, group) {
    var x1 = X(seg[0]), z1 = Z(seg[1]), x2 = X(seg[2]), z2 = Z(seg[3]);
    var len = Math.hypot(x2 - x1, z2 - z1);
    var m = new THREE.Mesh(boxGeo, mat);
    m.scale.set(len + thick, h, thick);
    m.position.set((x1 + x2) / 2, 0, (z1 + z2) / 2);
    m.rotation.y = Math.atan2(-(z2 - z1), x2 - x1);
    m.castShadow = true; m.receiveShadow = true;
    group.add(m);
    return m;
  }
  L.walls.perimeter.forEach(function (s) {
    var m = wall(s, 0.25, HT.cutWall, MAT.wall, G.structure);
    m.userData.full = HT.warehouseWall;
    tallables.push(m);
  });
  L.columns.forEach(function (c) {
    var m = box(MAT.column, X(c[0]) - 0.22, Z(c[1]) - 0.22, X(c[0]) + 0.22, Z(c[1]) + 0.22, 0, HT.cutWall + 0.05, G.structure);
    m.userData.full = HT.column;
    tallables.push(m);
  });
  L.walls.office.forEach(function (s) { wall(s, 0.16, HT.officeWall, MAT.officeWall, G.offices); });
  L.walls.partition.forEach(function (s) { wall(s, 0.08, HT.partition, MAT.partition, G.offices); });
  L.walls.enclosure.forEach(function (s) { wall(s, 0.1, HT.enclosure, MAT.enclosure, G.structure); });

  // ---------------------------------------------------------------------------
  // Áreas operacionais e salas
  // ---------------------------------------------------------------------------
  var labelDefs = [];
  function rectCenter(r) { return new THREE.Vector3(X((r[0] + r[2]) / 2), 0, Z((r[1] + r[3]) / 2)); }

  L.zones.forEach(function (z) {
    var r = z.rect, x0 = X(r[0]), z0 = Z(r[1]), x1 = X(r[2]), z1 = Z(r[3]);
    var m = new THREE.Mesh(planeGeo, tintMats[z.tint] || tintMats.neutral);
    m.scale.set(x1 - x0, 1, z1 - z0);
    m.position.set((x0 + x1) / 2, 0.008, (z0 + z1) / 2);
    m.receiveShadow = true;
    G.zones.add(m);
    var g = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(x0, 0.012, z0), new THREE.Vector3(x1, 0.012, z0),
      new THREE.Vector3(x1, 0.012, z1), new THREE.Vector3(x0, 0.012, z1), new THREE.Vector3(x0, 0.012, z0)
    ]);
    var line = new THREE.Line(g, zoneEdgeMat);
    line.computeLineDistances();
    G.zones.add(line);
    makePickable(m, z.name, z.info);
    if (z.label !== false) labelDefs.push({ text: z.name, pos: rectCenter(r).setY(0.3), cls: '', group: G.zones });
  });

  L.rooms.forEach(function (rm) {
    var m = boxPx(MAT.room, rm.rect, 0, 0.012, G.offices);
    m.castShadow = false;
    makePickable(m, rm.name, rm.info);
    if (rm.label !== false) labelDefs.push({ text: rm.name, pos: rectCenter(rm.rect).setY(HT.officeWall + 0.2), cls: 'room', group: G.offices, minor: true });
  });

  // ---------------------------------------------------------------------------
  // Porta-paletes (instanciados)
  // ---------------------------------------------------------------------------
  var R = L.racks;
  var uprights = [], beams = [], palletSlots = [];
  var UP = 0.09, BEAM_H = 0.12, BEAM_T = 0.06;
  var topLevel = R.levels.length - 1;

  R.rows.forEach(function (row) {
    var z0 = Z(row.v[0]), z1 = Z(row.v[1]), zm = (z0 + z1) / 2;
    var faces = [[z0, zm - 0.06], [zm + 0.06, z1]];
    var bays = [];
    [R.bays.left, R.bays.right].forEach(function (bl) {
      bl.forEach(function (u) {
        faces.forEach(function (f) {
          uprights.push([X(u), f[0] + UP / 2]);
          uprights.push([X(u), f[1] - UP / 2]);
        });
      });
      for (var i = 0; i < bl.length - 1; i++) bays.push({ a: bl[i], b: bl[i + 1], from: 0 });
    });
    bays.push({ a: R.bays.tunnel[0], b: R.bays.tunnel[1], from: R.tunnelFirstLevel });

    bays.forEach(function (bay) {
      var xa = X(bay.a), xb = X(bay.b), bw = xb - xa;
      faces.forEach(function (f) {
        var fd = f[1] - f[0];
        for (var li = bay.from; li <= topLevel; li++) {
          var y = R.levels[li];
          if (li > 0) {
            beams.push([xa + bw / 2, y - BEAM_H, f[0] + UP / 2, bw - UP]);
            beams.push([xa + bw / 2, y - BEAM_H, f[1] - UP / 2, bw - UP]);
          }
          [0.27, 0.73].forEach(function (t) {
            if (rnd() < R.occupancy) {
              palletSlots.push({ x: xa + bw * t, z: (f[0] + f[1]) / 2, y: y, w: Math.min(1.0, bw * 0.42), d: fd * 0.92, h: 0.85 + rnd() * 0.45 });
            }
          });
        }
      });
    });

    var hb = new THREE.Mesh(boxGeo, hitMat);
    var xl = X(R.bays.left[0]), xr = X(R.bays.right[R.bays.right.length - 1]);
    hb.scale.set(xr - xl, R.uprightHeight, z1 - z0);
    hb.position.set((xl + xr) / 2, 0, zm);
    G.racks.add(hb);
    makePickable(hb, row.name, row.positions + ' posições · porta-paletes duplo · 5 níveis · túnel de pedestres no centro');
    labelDefs.push({ text: row.name + ' · ' + row.positions + ' pos.', pos: new THREE.Vector3(xr + 0.4, R.uprightHeight + 0.3, zm), cls: 'row', group: G.racks });
  });

  var mtx = new THREE.Matrix4(), q = new THREE.Quaternion(), vPos = new THREE.Vector3(), vScl = new THREE.Vector3();
  function instanced(mat, list, fn, group) {
    var im = new THREE.InstancedMesh(boxGeo, mat, list.length);
    list.forEach(function (it, i) { fn(it, vPos, vScl); mtx.compose(vPos, q, vScl); im.setMatrixAt(i, mtx); });
    im.castShadow = true; im.receiveShadow = true;
    group.add(im);
    return im;
  }
  instanced(MAT.upright, uprights, function (u, p, s) { p.set(u[0], 0, u[1]); s.set(UP, R.uprightHeight, UP); }, G.racks);
  instanced(MAT.beam, beams, function (b, p, s) { p.set(b[0], b[1], b[2]); s.set(b[3], BEAM_H, BEAM_T); }, G.racks);

  // Paletes no piso (expedição, triagem, apoio)
  L.floorPallets.forEach(function (fp) {
    var rects = fp.rects ? fp.rects.slice() : [];
    if (fp.grid) {
      var gr = fp.grid;
      for (var r = 0; r < gr.rows; r++) for (var c = 0; c < gr.cols; c++) {
        var u0 = gr.u0 + c * gr.du, v0 = gr.v0 + r * gr.dv;
        rects.push([u0, v0, u0 + gr.w, v0 + gr.h]);
      }
    }
    rects.forEach(function (rc) {
      palletSlots.push({ x: X((rc[0] + rc[2]) / 2), z: Z((rc[1] + rc[3]) / 2), y: 0, w: (rc[2] - rc[0]) / S, d: (rc[3] - rc[1]) / S, h: 0.7 + rnd() * 0.6 });
    });
  });
  palletSlots.forEach(function (p) { p.c = Math.floor(rnd() * P.loads.length); });
  instanced(MAT.palletWood, palletSlots, function (p, pp, s) { pp.set(p.x, p.y, p.z); s.set(p.w, 0.14, p.d); }, G.pallets);
  var loadsMesh = instanced(loadMat, palletSlots, function (p, pp, s) { pp.set(p.x, p.y + 0.14, p.z); s.set(p.w * 0.96, p.h, p.d * 0.94); }, G.pallets);
  function colorLoads() {
    var col = new THREE.Color();
    palletSlots.forEach(function (p, i) { col.setHex(P.loads[p.c]); loadsMesh.setColorAt(i, col); });
    loadsMesh.instanceColor.needsUpdate = true;
  }
  colorLoads();

  // ---------------------------------------------------------------------------
  // Mobiliário
  // ---------------------------------------------------------------------------
  var FURN = {
    desk: { mat: 'desk', h: 0.75 }, table: { mat: 'desk', h: 0.75 }, bench: { mat: 'bench', h: 0.9 },
    counter: { mat: 'bench', h: 0.9 }, cabinet: { mat: 'bench', h: 1.8 }, sofa: { mat: 'sofa', h: 0.5 }
  };
  L.furniture.forEach(function (f) {
    if (f.type === 'stair') {
      var r = f.rect, steps = 12, x0 = X(r[0]), x1 = X(r[2]), zN = Z(r[1]), zS = Z(r[3]);
      for (var i = 0; i < steps; i++) {
        var za = zS + (zN - zS) * (i / steps), zb = zS + (zN - zS) * ((i + 1) / steps);
        box(MAT.stair, x0, Math.min(za, zb), x1, Math.max(za, zb), 0, HT.officeWall * (i + 1) / steps, G.furniture);
      }
      return;
    }
    var spec = FURN[f.type] || FURN.desk;
    boxPx(MAT[spec.mat], f.rect, 0, spec.h, G.furniture);
  });

  // ---------------------------------------------------------------------------
  // Pessoas e empilhadeiras
  // ---------------------------------------------------------------------------
  var bodyGeo = new THREE.CylinderGeometry(0.2, 0.22, 1.15, 16); bodyGeo.translate(0, 0.575, 0);
  var headGeo = new THREE.SphereGeometry(0.14, 16, 12); headGeo.translate(0, 1.36, 0);
  function person(group) {
    var g = new THREE.Group();
    var b = new THREE.Mesh(bodyGeo, MAT.person), h = new THREE.Mesh(headGeo, MAT.personHead);
    b.castShadow = h.castShadow = true;
    g.add(b, h);
    group.add(g);
    return g;
  }
  L.people.forEach(function (p) {
    var g = person(G.actors);
    g.position.set(X(p[0]), 0, Z(p[1]));
  });

  function forklift() {
    var g = new THREE.Group();
    box(MAT.forklift, -0.95, -0.52, 0.75, 0.52, 0.12, 0.95, g);
    box(MAT.forkliftDark, -0.95, -0.52, -0.55, 0.52, 1.07, 0.35, g);
    [[-0.9, -0.47], [-0.9, 0.47], [0.35, -0.47], [0.35, 0.47]].forEach(function (p) {
      box(MAT.forkliftDark, p[0] - 0.03, p[1] - 0.03, p[0] + 0.03, p[1] + 0.03, 1.07, 1.05, g);
    });
    box(MAT.forkliftDark, -0.95, -0.52, 0.41, 0.52, 2.1, 0.05, g);
    box(MAT.forkliftDark, 0.78, -0.42, 0.88, -0.32, 0, 2.4, g);
    box(MAT.forkliftDark, 0.78, 0.32, 0.88, 0.42, 0, 2.4, g);
    box(MAT.forkliftDark, 0.88, -0.35, 2.0, -0.23, 0.08, 0.05, g);
    box(MAT.forkliftDark, 0.88, 0.23, 2.0, 0.35, 0.08, 0.05, g);
    [[-0.6, -0.55], [-0.6, 0.55], [0.45, -0.55], [0.45, 0.55]].forEach(function (p) {
      box(MAT.forkliftDark, p[0] - 0.22, p[1] - 0.07, p[0] + 0.22, p[1] + 0.07, 0, 0.44, g);
    });
    var hit = new THREE.Mesh(boxGeo, hitMat);
    hit.scale.set(3, 2.5, 1.2); hit.position.x = 0.5;
    g.add(hit);
    makePickable(hit, 'Empilhadeira', 'Ilustrativa · trafega nos corredores entre fileiras, separada do caminho seguro');
    return g;
  }
  var lifts = L.forklifts.map(function (f) {
    var g = forklift();
    g.position.set(X(f.u[0]), 0, Z(f.v));
    G.actors.add(g);
    return { g: g, a: X(f.u[0]), b: X(f.u[1]), phase: f.phase };
  });

  // ---------------------------------------------------------------------------
  // Caminho seguro
  // ---------------------------------------------------------------------------
  var PW = L.path.width, pathLength = 0;
  var cornerGeo = new THREE.CircleGeometry(PW / 2, 24).rotateX(-Math.PI / 2);
  var pathMats = [];
  L.path.segments.forEach(function (line) {
    line.forEach(function (pt, i) {
      var c = new THREE.Mesh(cornerGeo, pathCornerMat);
      c.position.set(X(pt[0]), 0.018, Z(pt[1]));
      c.receiveShadow = true;
      G.path.add(c);
      if (i === 0) return;
      var a = line[i - 1];
      var x1 = X(a[0]), z1 = Z(a[1]), x2 = X(pt[0]), z2 = Z(pt[1]);
      var len = Math.hypot(x2 - x1, z2 - z1);
      pathLength += len;
      var tex = pathTex.clone();
      tex.repeat.set(len / 1.6, 1);
      var mat = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.8, polygonOffset: true, polygonOffsetFactor: -3, polygonOffsetUnits: -3 });
      pathMats.push(mat);
      var m = new THREE.Mesh(new THREE.PlaneGeometry(len, PW), mat);
      m.rotation.set(-Math.PI / 2, 0, Math.atan2(-(z2 - z1), x2 - x1));
      m.position.set((x1 + x2) / 2, 0.02, (z1 + z2) / 2);
      m.receiveShadow = true;
      G.path.add(m);
      makePickable(m, 'Caminho seguro', 'Rota de pedestres demarcada no piso, separada do tráfego de empilhadeiras');
    });
  });
  L.labels.forEach(function (l) {
    labelDefs.push({ text: l.text, pos: new THREE.Vector3(X(l.p[0]), 0.3, Z(l.p[1])), cls: l.kind === 'path' ? 'path' : '', group: l.kind === 'path' ? G.path : G.zones });
  });

  // Percurso do pedestre (tour)
  var tour = L.path.tour.map(function (t) { return { p: new THREE.Vector3(X(t.p[0]), 0, Z(t.p[1])), name: t.name }; });
  var tourCum = [0];
  for (var ti = 1; ti < tour.length; ti++) tourCum.push(tourCum[ti - 1] + tour[ti].p.distanceTo(tour[ti - 1].p));
  var tourLen = tourCum[tourCum.length - 1];
  function tourAt(s, out, dir) {
    s = ((s % tourLen) + tourLen) % tourLen;
    var i = 1;
    while (i < tourCum.length - 1 && tourCum[i] < s) i++;
    var a = tour[i - 1].p, b = tour[i].p, seg = tourCum[i] - tourCum[i - 1];
    var t = seg > 0 ? (s - tourCum[i - 1]) / seg : 0;
    out.lerpVectors(a, b, t);
    if (seg > 0.01) dir.subVectors(b, a).normalize();
    return i - 1;
  }

  var walker = person(G.path);
  var ringMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9 });
  var ring = new THREE.Mesh(new THREE.RingGeometry(0.34, 0.44, 32).rotateX(-Math.PI / 2), ringMat);
  ring.position.y = 0.03;
  walker.add(ring);
  var walkS = 0, walkPos = new THREE.Vector3(), walkDir = new THREE.Vector3(1, 0, 0), walkSeg = 0;

  // ---------------------------------------------------------------------------
  // Rótulos HTML
  // ---------------------------------------------------------------------------
  var labelsRoot = document.getElementById('labels');
  var labels = labelDefs.map(function (d) {
    var el = document.createElement('div');
    el.className = 'lbl ' + d.cls;
    el.textContent = d.text;
    labelsRoot.appendChild(el);
    return { el: el, pos: d.pos, group: d.group, minor: !!d.minor, shown: true };
  });

  // ---------------------------------------------------------------------------
  // Estado, camadas e tema
  // ---------------------------------------------------------------------------
  var state = { labels: true, tallWalls: false, tour: false };

  function setTall(on) {
    tallables.forEach(function (m) { m.scale.y = on ? m.userData.full : (m.userData.cut || (m.userData.cut = m.scale.y)); });
  }
  tallables.forEach(function (m) { m.userData.cut = m.scale.y; });

  document.querySelectorAll('[data-layer]').forEach(function (inp) {
    inp.addEventListener('change', function () { G[inp.dataset.layer].visible = inp.checked; });
  });
  document.querySelectorAll('[data-option]').forEach(function (inp) {
    inp.addEventListener('change', function () {
      state[inp.dataset.option] = inp.checked;
      if (inp.dataset.option === 'tallWalls') setTall(inp.checked);
    });
  });
  if (window.innerWidth < 760) document.getElementById('layers').open = false;

  function swatches() {
    var hex = function (n) { return '#' + new THREE.Color(n).getHexString(); };
    var map = { racks: hex(P.upright), pallets: hex(P.loads[1]), zones: hex(P.tints.sort), offices: hex(P.officeWall), furniture: hex(P.bench), actors: hex(P.forklift) };
    document.querySelectorAll('[data-layer]').forEach(function (inp) {
      var sw = inp.parentNode.querySelector('.swatch');
      if (map[inp.dataset.layer]) sw.style.setProperty('--sw', map[inp.dataset.layer]);
    });
  }

  function applyTheme() {
    P = PALETTES[currentTheme()];
    Object.keys(MAT).forEach(function (k) { MAT[k].color.setHex(P[k]); });
    Object.keys(tintMats).forEach(function (k) { tintMats[k].color.setHex(P.tints[k]); });
    zoneEdgeMat.color.setHex(P.zoneEdge);
    gridMat.color.setHex(P.grid);
    pathCornerMat.color.setHex(P.path);
    drawPathTexture();
    pathMats.forEach(function (m) { m.map.needsUpdate = true; });
    highlight.material.color.setHex(P.highlight);
    colorLoads();
    var bg = getComputedStyle(document.body).backgroundColor;
    scene.background = new THREE.Color(bg);
    shadowCatcher.material.opacity = currentTheme() === 'dark' ? 0.25 : 0.1;
    hemi.intensity = currentTheme() === 'dark' ? 0.6 : 0.66;
    swatches();
  }

  // ---------------------------------------------------------------------------
  // Destaque, dica e seleção
  // ---------------------------------------------------------------------------
  var highlight = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(1, 1, 1).translate(0, 0.5, 0)),
    new THREE.LineBasicMaterial({ color: P.highlight, transparent: true, opacity: 0.95, depthTest: false }));
  highlight.renderOrder = 10;
  highlight.visible = false;
  scene.add(highlight);

  var tip = document.getElementById('tip');
  var raycaster = new THREE.Raycaster();
  var ndc = new THREE.Vector2();
  var pointer = { x: 0, y: 0, inside: false, dirty: false };
  var hovered = null;
  var tmpBox = new THREE.Box3(), tmpV = new THREE.Vector3(), tmpC = new THREE.Vector3();

  function shown(obj) {
    for (var o = obj; o; o = o.parent) if (!o.visible) return false;
    return true;
  }
  function pick() {
    var rect = canvas.getBoundingClientRect();
    ndc.set(((pointer.x - rect.left) / rect.width) * 2 - 1, -((pointer.y - rect.top) / rect.height) * 2 + 1);
    raycaster.setFromCamera(ndc, camera);
    var hits = raycaster.intersectObjects(pickables, false);
    for (var i = 0; i < hits.length; i++) if (shown(hits[i].object)) return hits[i].object;
    return null;
  }
  function updateHover() {
    var obj = pointer.inside && !state.tour ? pick() : null;
    hovered = obj;
    if (!obj) { highlight.visible = false; tip.hidden = true; canvas.style.cursor = ''; return; }
    tmpBox.setFromObject(obj);
    tmpBox.getSize(tmpV); tmpBox.getCenter(tmpC);
    highlight.scale.set(Math.max(tmpV.x, 0.05) + 0.1, Math.max(tmpV.y, 0.05), Math.max(tmpV.z, 0.05) + 0.1);
    highlight.position.set(tmpC.x, tmpBox.min.y, tmpC.z);
    highlight.visible = true;
    tip.innerHTML = '';
    var b = document.createElement('b'); b.textContent = obj.userData.title;
    var s = document.createElement('span'); s.textContent = obj.userData.info;
    tip.appendChild(b); tip.appendChild(s);
    tip.hidden = false;
    var rect = document.getElementById('app').getBoundingClientRect();
    var tx = pointer.x - rect.left + 16, ty = pointer.y - rect.top + 16;
    if (tx + 270 > rect.width) tx = pointer.x - rect.left - 276;
    if (ty + 90 > rect.height) ty = pointer.y - rect.top - 90;
    tip.style.transform = 'translate(' + tx + 'px,' + ty + 'px)';
    canvas.style.cursor = 'pointer';
  }

  var downAt = null;
  canvas.addEventListener('pointermove', function (e) {
    pointer.x = e.clientX; pointer.y = e.clientY; pointer.inside = e.pointerType === 'mouse'; pointer.dirty = true;
  });
  canvas.addEventListener('pointerleave', function () { pointer.inside = false; pointer.dirty = true; });
  canvas.addEventListener('pointerdown', function (e) { downAt = { x: e.clientX, y: e.clientY, t: performance.now() }; });
  canvas.addEventListener('pointerup', function (e) {
    if (!downAt || state.tour) return;
    var moved = Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y);
    if (moved > 5 || performance.now() - downAt.t > 450) return;
    pointer.x = e.clientX; pointer.y = e.clientY;
    var obj = pick();
    if (!obj) return;
    tmpBox.setFromObject(obj);
    tmpBox.getSize(tmpV); tmpBox.getCenter(tmpC);
    var dist = Math.max(tmpV.x, tmpV.z, 5) * 1.25 + 4;
    var dir = new THREE.Vector3().subVectors(camera.position, controls.target).normalize();
    if (dir.y < 0.45) { dir.y = 0.45; dir.normalize(); }
    var target = new THREE.Vector3(tmpC.x, Math.min(tmpC.y, 1.5), tmpC.z);
    flyTo(target.clone().addScaledVector(dir, dist), target);
    setPressed(null);
  });

  // ---------------------------------------------------------------------------
  // Vistas e animação de câmera
  // ---------------------------------------------------------------------------
  var fly = null;
  function ease(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
  function flyTo(pos, target, dur) {
    dur = reduceMotion ? 0 : (dur === undefined ? 1.1 : dur);
    if (dur === 0) { camera.position.copy(pos); controls.target.copy(target); controls.update(); fly = null; return; }
    fly = { p0: camera.position.clone(), t0: controls.target.clone(), p1: pos, t1: target, k: 0, dur: dur };
  }
  function topDistance() {
    var vf = THREE.MathUtils.degToRad(camera.fov);
    var needH = (D + 6) / (2 * Math.tan(vf / 2));
    var needW = (W + 6) / (2 * Math.tan(vf / 2) * camera.aspect);
    return Math.max(needH, needW);
  }
  var VIEWS = {
    overview: function () {
      var t = new THREE.Vector3(0, 0, 1);
      var dir = new THREE.Vector3(0.42, 0.72, 0.56).normalize();
      return { pos: t.clone().addScaledVector(dir, topDistance() * 1.08), target: t };
    },
    top: function () { return { pos: new THREE.Vector3(0, topDistance(), 0.01), target: new THREE.Vector3(0, 0, 0) }; },
    storage: function () {
      var t = new THREE.Vector3(X(1207), 2, Z(1270));
      return { pos: t.clone().add(new THREE.Vector3(-13, 17, 21)), target: t };
    },
    offices: function () {
      var t = new THREE.Vector3(X(1820), 0, Z(2930));
      return { pos: t.clone().add(new THREE.Vector3(5, 15, 15)), target: t };
    }
  };
  function setPressed(view) {
    document.querySelectorAll('.views [data-view]').forEach(function (b) {
      if (b.dataset.view !== 'tour') b.setAttribute('aria-pressed', String(b.dataset.view === view));
    });
  }
  function goView(name, instant) {
    if (name === 'tour') { startTour(); return; }
    if (state.tour) stopTour(true);
    var v = VIEWS[name]();
    flyTo(v.pos, v.target, instant ? 0 : undefined);
    setPressed(name);
  }
  document.querySelectorAll('.views [data-view]').forEach(function (b) {
    b.addEventListener('click', function () { goView(b.dataset.view); });
  });

  // ---------------------------------------------------------------------------
  // Percurso guiado pelo caminho seguro
  // ---------------------------------------------------------------------------
  var hud = document.getElementById('hud'), hudWhere = document.getElementById('hud-where');
  var hudBar = document.getElementById('hud-bar'), hudMeta = document.getElementById('hud-meta');
  var tourStartS = 0, camGoal = new THREE.Vector3(), lookGoal = new THREE.Vector3(), lookCur = new THREE.Vector3();

  function startTour() {
    if (state.tour) return;
    state.tour = true;
    fly = null;
    walkS = 0; tourStartS = 0;
    controls.enabled = false;
    G.path.visible = true;
    document.getElementById('lyr-path').checked = true;
    hud.hidden = false;
    highlight.visible = false; tip.hidden = true;
    setPressed(null);
    tourAt(0, walkPos, walkDir);
    lookCur.copy(walkPos).setY(1.3);
  }
  function stopTour(silent) {
    if (!state.tour) return;
    state.tour = false;
    controls.enabled = true;
    hud.hidden = true;
    controls.target.copy(lookCur);
    controls.update();
    if (!silent) goView('overview');
  }
  document.getElementById('hud-stop').addEventListener('click', function () { stopTour(false); });
  window.addEventListener('keydown', function (e) { if (e.key === 'Escape' && state.tour) stopTour(false); });

  // ---------------------------------------------------------------------------
  // Resumo (carimbo)
  // ---------------------------------------------------------------------------
  function fmt(n, d) { return n.toLocaleString('pt-BR', { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 }); }
  var totalPositions = R.rows.reduce(function (s, r) { return s + r.positions; }, 0);
  document.getElementById('st-area').innerHTML = '≈ ' + fmt(Math.round(W * D / 10) * 10) + ' <small>m²</small>';
  document.getElementById('st-dims').innerHTML = fmt(W) + ' × ' + fmt(D) + ' <small>m</small>';
  document.getElementById('st-pos').textContent = fmt(totalPositions);
  document.getElementById('st-rows').innerHTML = R.rows.length + ' <small>fileiras duplas</small>';
  document.getElementById('st-path').innerHTML = '≈ ' + fmt(Math.round(pathLength)) + ' <small>m de faixa</small><small class="line">Volta completa pelo percurso: ' + fmt(Math.round(tourLen)) + ' m</small>';

  // ---------------------------------------------------------------------------
  // Loop principal
  // ---------------------------------------------------------------------------
  function resize() {
    var w = canvas.clientWidth, h = canvas.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  var labelV = new THREE.Vector3();
  function updateLabels() {
    var w = canvas.clientWidth, h = canvas.clientHeight;
    var hideAll = !state.labels || state.tour;
    labels.forEach(function (l) {
      var show = !hideAll && shown(l.group);
      if (show && l.minor) show = camera.position.distanceTo(l.pos) < 42;
      if (show) {
        labelV.copy(l.pos).project(camera);
        show = labelV.z < 1 && Math.abs(labelV.x) < 1.1 && Math.abs(labelV.y) < 1.1;
      }
      if (show !== l.shown) { l.el.hidden = !show; l.shown = show; }
      if (show) {
        var x = (labelV.x * 0.5 + 0.5) * w, y = (-labelV.y * 0.5 + 0.5) * h;
        l.el.style.transform = 'translate(-50%,-100%) translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px)';
      }
    });
  }

  var clock = new THREE.Clock(), elapsed = 0;
  var camOffset = new THREE.Vector3();
  function frame() {
    var dt = Math.min(clock.getDelta(), 0.25);
    elapsed += dt;

    // pedestre caminhando pelo percurso
    var speed = state.tour ? 2.6 : 1.3;
    if (!reduceMotion || state.tour) walkS += dt * speed;
    walkSeg = tourAt(walkS, walkPos, walkDir);
    walker.position.copy(walkPos);
    walker.rotation.y = Math.atan2(-walkDir.z, walkDir.x);
    ring.scale.setScalar(1 + 0.12 * Math.sin(elapsed * 4));

    // empilhadeiras indo e voltando no corredor
    if (!reduceMotion) lifts.forEach(function (f) {
      var t = 0.5 - 0.5 * Math.cos(elapsed * 0.22 + f.phase * Math.PI * 2);
      f.g.position.x = f.a + (f.b - f.a) * t;
    });

    if (state.tour) {
      camOffset.copy(walkDir).multiplyScalar(-8);
      camGoal.copy(walkPos).add(camOffset).setY(4.3);
      lookGoal.copy(walkPos).addScaledVector(walkDir, 7).setY(0.9);
      var k = 1 - Math.exp(-dt * 2.4);
      camera.position.lerp(camGoal, k);
      lookCur.lerp(lookGoal, k);
      camera.lookAt(lookCur);
      var done = walkS - tourStartS;
      hudWhere.textContent = tour[walkSeg].name;
      hudBar.style.width = Math.min(100, (done / tourLen) * 100).toFixed(1) + '%';
      hudMeta.textContent = fmt(Math.min(done, tourLen)) + ' de ' + fmt(tourLen) + ' m';
      if (done >= tourLen) stopTour(false);
    } else if (fly) {
      fly.k = Math.min(1, fly.k + dt / fly.dur);
      var e = ease(fly.k);
      camera.position.lerpVectors(fly.p0, fly.p1, e);
      controls.target.lerpVectors(fly.t0, fly.t1, e);
      if (fly.k >= 1) fly = null;
      controls.update();
    } else {
      controls.update();
    }

    if (pointer.dirty) { pointer.dirty = false; updateHover(); }
    renderer.render(scene, camera);
    updateLabels();
    requestAnimationFrame(frame);
  }

  applyTheme();
  var mq = window.matchMedia('(prefers-color-scheme: dark)');
  if (mq.addEventListener) mq.addEventListener('change', applyTheme);
  new MutationObserver(applyTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  goView('overview', true);
  statusEl.hidden = true;
  requestAnimationFrame(frame);
})();
</script>
