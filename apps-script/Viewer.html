<script>
(function () {
  'use strict';

  var statusEl = document.getElementById('status');
  function fail(msg) { statusEl.hidden = false; statusEl.textContent = msg; }

  if (typeof THREE === 'undefined' || !THREE.OrbitControls) {
    fail('Não foi possível carregar a biblioteca 3D (Three.js). Verifique a conexão com a internet e recarregue a página.');
    return;
  }

  // ---------------------------------------------------------------------------
  // Dados da planta e conversão pixel -> metro
  // ---------------------------------------------------------------------------
  var L = JSON.parse(document.getElementById('layout-data').textContent);
  var S = L.meta.pxPerMeter;
  var HT = L.meta.heights;
  var B = L.meta.bounds;
  var CX = (B[0] + B[2]) / 2, CY = (B[1] + B[3]) / 2;
  var W = (B[2] - B[0]) / S, D = (B[3] - B[1]) / S;
  function X(u) { return (u - CX) / S; }
  function Z(v) { return (v - CY) / S; }

  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var R_UPRIGHT_H = L.racks.uprightHeight;

  // Pseudo-aleatório determinístico: o modelo fica igual a cada carregamento
  var seed = 20260928;
  function rnd() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }

  // ---------------------------------------------------------------------------
  // Paletas (claro / escuro)
  // ---------------------------------------------------------------------------
  var PALETTES = {
    light: {
      slab: 0xc9c8c3, slabSide: 0xaeaca5, grid: 0xc6c4be, wall: 0xcbc5ba, louver: 0xaba6bb, door: 0x8e949c,
      fence: 0x2b2f34, officeWall: 0xe7e5e0, partition: 0xb9bec6, column: 0xc1bcb2, upright: 0x2f55d4, beam: 0xe8a317,
      palletWood: 0xffffff, palletBlue: 0xffffff, desk: 0xf6f6f4, workTop: 0x24282d, workFrame: 0xc3c6cb,
      bench: 0xc4ccd6, sofa: 0x9aa6b8, stair: 0xd2d6db, monitor: 0x1b1e23, gantry: 0x1f2226, sign: 0xe8572a,
      cooler: 0xf3f3f1, tv: 0x16181c, screen: 0xe7e3f4, tape: 0xe8b818, cageSilver: 0xc9ced6, cagePink: 0xe46aa3,
      person: 0xf2c230, personHead: 0x2b3440, shirtBlue: 0x2a8fd6, shirtBlack: 0x2a2d33, legs: 0x2b3440,
      forklift: 0xf08c00, forkliftDark: 0x2b3440,
      path: 0x178a4c, pathMark: '#ffffff', room: 0xf3f1ec, zoneEdge: 0x7d8794, highlight: 0x2f55d4,
      loads: [0xffffff, 0xf4f4f4, 0xe9e9e9, 0xdedede, 0xefefef],
      tints: { storage: 0xdfe5f2, danger: 0xf3d4d4, ship: 0xd6ecde, neutral: 0xe0e2e5, sort: 0xd8e3f7, test: 0xf5e6c8, office: 0xe3e6ee, receive: 0xe7ddf3, dock: 0xcfd3d8 }
    },
    dark: {
      slab: 0x2b2d2f, slabSide: 0x1f2123, grid: 0x36393c, wall: 0x4b4841, louver: 0x4d4b5a, door: 0x5b6169,
      fence: 0x0e1012, officeWall: 0x56544f, partition: 0x5a6472, column: 0x4d4a44, upright: 0x5b7cf0, beam: 0xe0a02a,
      palletWood: 0x8c8c8c, palletBlue: 0x9a9a9a, desk: 0x4a4f56, workTop: 0x121417, workFrame: 0x5a5f66,
      bench: 0x4a5563, sofa: 0x566278, stair: 0x3e4651, monitor: 0x0b0c0e, gantry: 0x0e0f11, sign: 0xe8572a,
      cooler: 0x8b8d8f, tv: 0x0b0c0e, screen: 0x7b77a3, tape: 0xd6a915, cageSilver: 0x9aa0a8, cagePink: 0xc85a8d,
      person: 0xf2c230, personHead: 0xd9dee5, shirtBlue: 0x3a9be0, shirtBlack: 0x1b1d21, legs: 0x15181c,
      forklift: 0xf08c00, forkliftDark: 0x151a20,
      path: 0x2fb86a, pathMark: '#e9fff2', room: 0x2c3036, zoneEdge: 0x6b7686, highlight: 0x9db4ff,
      loads: [0x9e9e9e, 0x979797, 0x8f8f8f, 0x888888, 0x939393],
      tints: { storage: 0x252c3a, danger: 0x3b2427, ship: 0x21362a, neutral: 0x303338, sort: 0x233049, test: 0x3d3324, office: 0x2b303b, receive: 0x322a45, dock: 0x3a3e44 }
    }
  };
  function currentTheme() {
    var t = document.documentElement.getAttribute('data-theme');
    if (t === 'dark' || t === 'light') return t;
    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  var P = PALETTES[currentTheme()];

  // ---------------------------------------------------------------------------
  // Renderizador, câmera e controles
  // ---------------------------------------------------------------------------
  var canvas = document.getElementById('scene');
  var renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  } catch (e) {
    fail('Este navegador não conseguiu iniciar o WebGL, necessário para o modelo 3D.');
    return;
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(40, 1, 0.1, 600);
  var controls = new THREE.OrbitControls(camera, canvas);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.maxPolarAngle = Math.PI * 0.49;
  controls.minDistance = 3;
  controls.maxDistance = 170;
  controls.screenSpacePanning = false;

  var hemi = new THREE.HemisphereLight(0xffffff, 0xcfd3da, 0.66);
  scene.add(hemi);
  var sun = new THREE.DirectionalLight(0xffffff, 0.66);
  sun.position.set(24, 48, 20);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -34; sun.shadow.camera.right = 34;
  sun.shadow.camera.top = 34; sun.shadow.camera.bottom = -34;
  sun.shadow.camera.near = 1; sun.shadow.camera.far = 140;
  sun.shadow.bias = -0.0004;
  sun.shadow.normalBias = 0.03;
  scene.add(sun);
  scene.add(sun.target);

  // ---------------------------------------------------------------------------
  // Materiais (recoloridos quando o tema muda)
  // ---------------------------------------------------------------------------
  var MAT = {};
  function std(key, extra) {
    var m = new THREE.MeshStandardMaterial(Object.assign({ color: P[key], roughness: 0.92, metalness: 0 }, extra || {}));
    m.userData.key = key;
    MAT[key] = m;
    return m;
  }
  ['slab', 'slabSide', 'officeWall', 'partition', 'column', 'upright', 'beam', 'palletWood', 'palletBlue',
   'desk', 'workTop', 'workFrame', 'bench', 'sofa', 'stair', 'monitor', 'gantry', 'sign', 'cooler', 'tv', 'tape',
   'person', 'personHead', 'shirtBlue', 'shirtBlack', 'legs', 'forklift', 'forkliftDark', 'cageSilver', 'cagePink'
  ].forEach(function (k) { std(k); });
  MAT.cageSilver.metalness = 0.6; MAT.cageSilver.roughness = 0.35;
  MAT.cagePink.metalness = 0.3; MAT.cagePink.roughness = 0.45;
  MAT.palletBlue.roughness = 0.55;
  MAT.monitor.roughness = 0.4;
  MAT.gantry.roughness = 0.5; MAT.gantry.metalness = 0.3;
  var ledMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  std('screen', { emissive: P.screen, emissiveIntensity: 0.35 });

  // Texturas procedurais em tons de cinza (a cor vem da paleta, então o tema escuro funciona)
  function canvasTex(w, h, draw, repeat) {
    var c = document.createElement('canvas'); c.width = w; c.height = h;
    draw(c.getContext('2d'), w, h);
    var t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return t;
  }
  function speckle(g, w, h, base, spread, n) {
    g.fillStyle = base; g.fillRect(0, 0, w, h);
    for (var i = 0; i < n; i++) {
      var v = Math.floor(255 - rnd() * spread);
      g.fillStyle = 'rgba(' + v + ',' + v + ',' + v + ',0.35)';
      g.fillRect(rnd() * w, rnd() * h, 1 + rnd() * 2, 1 + rnd() * 2);
    }
  }
  // Ruído de valor com várias oitavas, repetível nas bordas (textura sem emenda visível)
  function noiseField(size, cells, octaves, sx) {
    sx = sx || 1;
    var out = new Float32Array(size * size), amp = 1, total = 0;
    for (var o = 0; o < octaves; o++) {
      var ny = cells << o, nx = Math.max(1, Math.round(ny * sx)), lat = new Float32Array(nx * ny);
      for (var i = 0; i < lat.length; i++) lat[i] = rnd();
      for (var y = 0; y < size; y++) {
        var fy = y / size * ny, y0 = Math.floor(fy), ty = fy - y0; ty = ty * ty * (3 - 2 * ty);
        var y1 = (y0 + 1) % ny;
        for (var x = 0; x < size; x++) {
          var fx = x / size * nx, x0 = Math.floor(fx), tx = fx - x0; tx = tx * tx * (3 - 2 * tx);
          var x1 = (x0 + 1) % nx;
          var a = lat[y0 * nx + x0], b = lat[y0 * nx + x1], c = lat[y1 * nx + x0], d = lat[y1 * nx + x1];
          out[y * size + x] += amp * ((a + (b - a) * tx) * (1 - ty) + (c + (d - c) * tx) * ty);
        }
      }
      total += amp; amp *= 0.5;
    }
    for (var k = 0; k < out.length; k++) out[k] /= total;
    return out;
  }
  function paint(g, size, fn) {
    var img = g.createImageData(size, size), d = img.data;
    for (var y = 0; y < size; y++) for (var x = 0; x < size; x++) {
      var c = fn(x, y, y * size + x), i = (y * size + x) * 4;
      d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; d[i + 3] = 255;
    }
    g.putImageData(img, 0, 0);
  }
  function clamp255(v) { return v < 0 ? 0 : v > 255 ? 255 : v; }

  // Piso de concreto polido: nuvens de tonalidade, manchas, agregado e juntas serradas a cada 6 m
  var FLOOR = 512;
  var floorNoise = noiseField(FLOOR, 4, 5), floorStain = noiseField(FLOOR, 2, 3), floorFine = noiseField(FLOOR, 64, 2);
  var floorTex = canvasTex(FLOOR, FLOOR, function (g, w, h) {
    paint(g, w, function (x, y, i) {
      var v = 0.8 + 0.2 * floorNoise[i];
      var st = floorStain[i]; if (st > 0.62) v -= (st - 0.62) * 0.55;
      v += (floorFine[i] - 0.5) * 0.05;
      if (rnd() < 0.012) v -= 0.08 + rnd() * 0.1;
      var c = clamp255(v * 255);
      return [c, c, c * 0.985];
    });
    g.fillStyle = 'rgba(40,40,40,0.35)';
    g.fillRect(0, 0, w, 2); g.fillRect(0, 0, 2, h);
    g.strokeStyle = 'rgba(30,30,30,0.18)'; g.lineWidth = 1;   // fissuras finas
    for (var k = 0; k < 3; k++) {
      var cx = rnd() * w, cy = rnd() * h;
      g.beginPath(); g.moveTo(cx, cy);
      for (var j = 0; j < 8; j++) { cx += (rnd() - 0.5) * 30; cy += rnd() * 18; g.lineTo(cx, cy); }
      g.stroke();
    }
  });
  floorTex.repeat.set(W / 6, D / 6);
  var floorRough = canvasTex(FLOOR, FLOOR, function (g, w, h) {
    paint(g, w, function (x, y, i) { var r = clamp255((0.5 + 0.4 * floorStain[i] + 0.1 * floorNoise[i]) * 255); return [r, r, r]; });
  });
  floorRough.repeat.copy(floorTex.repeat);
  MAT.slab.map = floorTex;
  MAT.slab.roughnessMap = floorRough;
  MAT.slab.roughness = 1;

  // Painéis de concreto pré-moldado: tonalidade irregular, escorridos, insertos de içamento e juntas
  var wallNoise = noiseField(256, 4, 5), wallFine = noiseField(256, 48, 2);
  var concreteTex = canvasTex(256, 256, function (g, w, h) {
    paint(g, w, function (x, y, i) {
      var c = clamp255((0.8 + 0.18 * wallNoise[i] + (wallFine[i] - 0.5) * 0.06) * 255);
      return [c, c * 0.99, c * 0.97];
    });
    for (var k = 0; k < 14; k++) {                                   // escorridos verticais
      var sx = rnd() * w, len = 40 + rnd() * 160, gr = g.createLinearGradient(0, 0, 0, len);
      gr.addColorStop(0, 'rgba(60,55,50,0.22)'); gr.addColorStop(1, 'rgba(60,55,50,0)');
      g.fillStyle = gr; g.fillRect(sx, 0, 1 + rnd() * 3, len);
    }
    g.fillStyle = 'rgba(0,0,0,0.05)';                                 // marcas de fôrma
    for (var b = 1; b < 4; b++) g.fillRect(0, b * h / 4, w, 1);
    g.fillStyle = 'rgba(40,40,40,0.45)';                              // insertos de içamento
    [w * 0.25, w * 0.75].forEach(function (px) { g.beginPath(); g.arc(px, 18, 4, 0, Math.PI * 2); g.fill(); });
    g.fillStyle = 'rgba(0,0,0,0.3)';
    g.fillRect(0, h - 4, w, 4); g.fillRect(0, 0, 3, h);              // juntas
  });
  // Venezianas de ventilação no alto das paredes
  var louverTex = canvasTex(64, 64, function (g, w, h) {
    var gr = g.createLinearGradient(0, 0, 0, h);
    gr.addColorStop(0, '#fbfbfd'); gr.addColorStop(0.8, '#e2e1e8'); gr.addColorStop(1, '#8e8c98');
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
    g.fillStyle = 'rgba(0,0,0,0.5)'; g.fillRect(0, 0, 2, h);
  });
  // Porta de enrolar das docas: lâminas metálicas com leve desgaste
  var doorTex = canvasTex(64, 64, function (g, w, h) {
    var gr = g.createLinearGradient(0, 0, 0, h);
    gr.addColorStop(0, '#ffffff'); gr.addColorStop(0.85, '#e4e4e4'); gr.addColorStop(1, '#a8a8a8');
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
    for (var k = 0; k < 40; k++) { g.fillStyle = 'rgba(80,70,60,' + (rnd() * 0.12) + ')'; g.fillRect(rnd() * w, rnd() * h, 2, 1); }
  });
  // Tela da cerca das docas (transparente entre os fios)
  var meshTex = canvasTex(64, 64, function (g, w, h) {
    g.clearRect(0, 0, w, h);
    g.fillStyle = '#ffffff';
    g.fillRect(0, 0, w, 6); g.fillRect(0, 0, 6, h);
  });
  var tracked = []; // materiais clonados por parede: recoloridos junto com o tema
  function trackedMat(key, map, extra) {
    var m = new THREE.MeshStandardMaterial(Object.assign({ color: P[key], roughness: 0.95, map: map }, extra || {}));
    m.userData.key = key;
    tracked.push(m);
    return m;
  }
  MAT.upright.roughness = 0.6; MAT.upright.metalness = 0.15;
  MAT.beam.roughness = 0.6; MAT.beam.metalness = 0.1;
  std('room', { polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -1 });

  // Papelão: fibras kraft, fita adesiva central e etiqueta com código de barras
  var boxNoise = noiseField(256, 8, 3, 0.25);
  var cardboardTex = canvasTex(256, 256, function (g, w, h) {
    paint(g, w, function (x, y, i) {
      var v = 0.9 + 0.1 * boxNoise[i] + (rnd() - 0.5) * 0.04;
      return [clamp255(205 * v), clamp255(168 * v), clamp255(118 * v)];
    });
    g.fillStyle = 'rgba(214,190,150,0.85)'; g.fillRect(w * 0.42, 0, w * 0.16, h);
    g.fillStyle = 'rgba(255,255,255,0.12)'; g.fillRect(w * 0.44, 0, w * 0.03, h);
    g.fillStyle = '#f7f7f4'; g.fillRect(w * 0.62, h * 0.66, w * 0.3, h * 0.24);
    g.fillStyle = '#222';
    for (var bx = 0; bx < 26; bx++) if (rnd() > 0.35) g.fillRect(w * 0.64 + bx * 2.4, h * 0.78, rnd() > 0.5 ? 2 : 1, h * 0.09);
    g.fillRect(w * 0.64, h * 0.69, w * 0.18, 3); g.fillRect(w * 0.64, h * 0.73, w * 0.12, 2);
    g.strokeStyle = 'rgba(90,70,40,0.35)'; g.lineWidth = 2; g.strokeRect(1, 1, w - 2, h - 2);
  });
  var loadMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.92, map: cardboardTex });

  // Palete de madeira: 5 tábuas com veios e frestas
  var woodNoise = noiseField(256, 24, 3, 0.1); // veios alongados no sentido das tábuas
  var woodTex = canvasTex(256, 256, function (g, w, h) {
    var tones = [];
    for (var t = 0; t < 5; t++) tones.push(0.85 + rnd() * 0.25);
    paint(g, w, function (x, y, i) {
      var plank = Math.floor(y / (h / 5)), inPlank = (y % (h / 5)) / (h / 5);
      if (inPlank > 0.86) return [70, 52, 34];
      var v = tones[plank] * (0.82 + 0.18 * woodNoise[i]);
      return [clamp255(196 * v), clamp255(150 * v), clamp255(98 * v)];
    });
    g.fillStyle = 'rgba(60,40,20,0.55)';
    for (var n = 0; n < 5; n++) [0.08, 0.5, 0.92].forEach(function (px) { g.fillRect(w * px, n * h / 5 + 8, 3, 3); g.fillRect(w * px, n * h / 5 + 30, 3, 3); });
  });
  MAT.palletWood.map = woodTex;

  // Palete plástico azul: grade vazada com cantos arredondados
  var plasticTex = canvasTex(256, 256, function (g, w, h) {
    g.fillStyle = '#2f5cc8'; g.fillRect(0, 0, w, h);
    g.fillStyle = '#16307a';
    for (var r = 0; r < 8; r++) for (var c = 0; c < 8; c++) {
      if ((r === 0 || r === 7 || r === 3 || r === 4) && (c === 0 || c === 7 || c === 3 || c === 4)) continue; // blocos de apoio
      var x = c * w / 8 + 6, y = r * h / 8 + 6, ww = w / 8 - 12, hh = h / 8 - 12;
      g.beginPath(); g.moveTo(x + 4, y); g.lineTo(x + ww - 4, y); g.quadraticCurveTo(x + ww, y, x + ww, y + 4);
      g.lineTo(x + ww, y + hh - 4); g.quadraticCurveTo(x + ww, y + hh, x + ww - 4, y + hh); g.lineTo(x + 4, y + hh);
      g.quadraticCurveTo(x, y + hh, x, y + hh - 4); g.lineTo(x, y + 4); g.quadraticCurveTo(x, y, x + 4, y); g.fill();
    }
    g.fillStyle = 'rgba(255,255,255,0.08)'; g.fillRect(0, 0, w, 3);
  });
  MAT.palletBlue.map = plasticTex;

  // Montante do porta-paletes: furação em pares ao longo da coluna
  var uprightTex = canvasTex(32, 64, function (g, w, h) {
    g.fillStyle = '#ffffff'; g.fillRect(0, 0, w, h);
    g.fillStyle = 'rgba(0,0,0,0.55)';
    g.fillRect(7, 10, 5, 16); g.fillRect(20, 10, 5, 16);
    g.fillStyle = 'rgba(0,0,0,0.12)'; g.fillRect(0, 0, 2, h); g.fillRect(w - 2, 0, 2, h);
  });
  uprightTex.repeat.set(1, R_UPRIGHT_H / 0.1);
  MAT.upright.map = uprightTex;

  // Tampo preto laminado com riscos leves e tampo branco melamínico
  var lamNoise = noiseField(128, 16, 2);
  var laminateTex = canvasTex(128, 128, function (g, w, h) {
    paint(g, w, function (x, y, i) { var c = clamp255((0.85 + 0.15 * lamNoise[i]) * 255); return [c, c, c]; });
    g.strokeStyle = 'rgba(255,255,255,0.35)'; g.lineWidth = 1;
    for (var k = 0; k < 12; k++) { var x = rnd() * w, y = rnd() * h; g.beginPath(); g.moveTo(x, y); g.lineTo(x + (rnd() - 0.5) * 40, y + (rnd() - 0.5) * 10); g.stroke(); }
  });
  MAT.workTop.map = laminateTex; MAT.workTop.roughness = 0.55;

  // Fita de demarcação com desgaste de uso
  var tapeNoise = noiseField(128, 16, 3, 0.2);
  MAT.tape.map = canvasTex(128, 128, function (g, w, h) {
    paint(g, w, function (x, y, i) { var c = clamp255((tapeNoise[i] > 0.7 ? 0.72 : 0.94 + 0.06 * rnd()) * 255); return [c, c, c]; });
  });

  // Grelha lateral do climatizador
  MAT.cooler.map = canvasTex(64, 64, function (g, w, h) {
    g.fillStyle = '#ffffff'; g.fillRect(0, 0, w, h);
    g.fillStyle = 'rgba(0,0,0,0.18)';
    for (var y = 4; y < h; y += 6) g.fillRect(4, y, w - 8, 2);
  });

  // Tecido do sofá e reboco pintado das paredes do escritório
  var fabricNoise = noiseField(128, 32, 2);
  MAT.sofa.map = canvasTex(128, 128, function (g, w, h) {
    paint(g, w, function (x, y, i) { var c = clamp255((0.85 + 0.15 * fabricNoise[i] + ((x + y) % 4 === 0 ? -0.05 : 0)) * 255); return [c, c, c]; });
  });
  var plasterNoise = noiseField(128, 6, 4);
  MAT.officeWall.map = canvasTex(128, 128, function (g, w, h) {
    paint(g, w, function (x, y, i) { var c = clamp255((0.93 + 0.07 * plasterNoise[i]) * 255); return [c, c, c]; });
  });

  // Porcelanato 60 x 60 cm dos escritórios
  var tileNoise = noiseField(256, 8, 3);
  var tileTex = canvasTex(256, 256, function (g, w, h) {
    paint(g, w, function (x, y, i) { var c = clamp255((0.95 + 0.05 * tileNoise[i]) * 255); return [c, c, c]; });
    g.fillStyle = 'rgba(0,0,0,0.16)'; g.fillRect(0, 0, w, 2); g.fillRect(0, 0, 2, h);
  });

  // Tela dos monitores: planilha e sistema de estoque (como nas fotos da operação)
  var screenTex = canvasTex(256, 160, function (g, w, h) {
    g.fillStyle = '#1d2330'; g.fillRect(0, 0, w, h);
    g.fillStyle = '#fbf6d6'; g.fillRect(4, 14, w * 0.62, h - 18);
    g.fillStyle = '#ffffff'; g.fillRect(w * 0.64, 14, w * 0.36 - 4, h - 18);
    g.fillStyle = '#e8572a'; g.fillRect(0, 0, w, 10);
    g.fillStyle = 'rgba(0,0,0,0.25)';

  // Gaiolas metálicas vazadas (prata e rosa) com produtos pequenos nas prateleiras
  var cageMeshMats = {};

  // ---------------------------------------------------------------------------

  });

  // Percurso do pedestre (tour)
  var tour = L.path.tour.map(function (t) { return { p: new THREE.Vector3(X(t.p[0]), 0, Z(t.p[1])), name: t.name }; });
  var tourCum = [0];
  for (var ti = 1; ti < tour.length; ti++) tourCum.push(tourCum[ti - 1] + tour[ti].p.distanceTo(tour[ti - 1].p));
  var tourLen = tourCum[tourCum.length - 1];
  function tourAt(s, out, dir) {
    s = ((s % tourLen) + tourLen) % tourLen;
    var i = 1;
    while (i < tourCum.length - 1 && tourCum[i] < s) i++;
    var a = tour[i - 1].p, b = tour[i].p, seg = tourCum[i] - tourCum[i - 1];
    var t = seg > 0 ? (s - tourCum[i - 1]) / seg : 0;
    out.lerpVectors(a, b, t);
    if (seg > 0.01) dir.subVectors(b, a).normalize();
    return i - 1;
  }

  var walker = human({ pose: 'walk', shirt: MAT.person, seed: 2 });
  G.path.add(walker);
  var ringMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9 });
  var ring = new THREE.Mesh(new THREE.RingGeometry(0.34, 0.44, 32).rotateX(-Math.PI / 2), ringMat);
  ring.position.y = 0.03;
  walker.add(ring);
  var walkS = 0, walkPos = new THREE.Vector3(), walkDir = new THREE.Vector3(1, 0, 0), walkSeg = 0;

  // ---------------------------------------------------------------------------
  // Rótulos HTML
  // ---------------------------------------------------------------------------
  var labelsRoot = document.getElementById('labels');
  var labels = labelDefs.map(function (d) {
    var el = document.createElement('div');
    el.className = 'lbl ' + d.cls;
    el.textContent = d.text;
    labelsRoot.appendChild(el);
    return { el: el, pos: d.pos, group: d.group, minor: !!d.minor, shown: true };
  });

  // ---------------------------------------------------------------------------
  // Estado, camadas e tema
  // ---------------------------------------------------------------------------
  var state = { labels: true, tallWalls: false, tour: false };

  function setTall(on) {
    tallables.forEach(function (m) {
      m.scale.y = on ? m.userData.full : m.userData.cut;
      if (m.userData.tex) m.userData.tex.repeat.y = m.scale.y / 2.2;
    });
    louvers.forEach(function (m) { m.visible = on; });
  }
  tallables.forEach(function (m) { m.userData.cut = m.scale.y; });

  document.querySelectorAll('[data-layer]').forEach(function (inp) {
    inp.addEventListener('change', function () { G[inp.dataset.layer].visible = inp.checked; });
  });
  document.querySelectorAll('[data-option]').forEach(function (inp) {
    inp.addEventListener('change', function () {
      state[inp.dataset.option] = inp.checked;
      if (inp.dataset.option === 'tallWalls') setTall(inp.checked);
    });
  });
  if (window.innerWidth < 760) document.getElementById('layers').open = false;

  function swatches() {
    var hex = function (n) { return '#' + new THREE.Color(n).getHexString(); };
    var map = { racks: hex(P.upright), pallets: '#c8a878', zones: hex(P.tints.sort), offices: hex(P.officeWall), furniture: hex(P.bench), actors: hex(P.forklift) };
    document.querySelectorAll('[data-layer]').forEach(function (inp) {
      var sw = inp.parentNode.querySelector('.swatch');
      if (map[inp.dataset.layer]) sw.style.setProperty('--sw', map[inp.dataset.layer]);
    });
  }

  function applyTheme() {
    P = PALETTES[currentTheme()];
    Object.keys(MAT).forEach(function (k) { MAT[k].color.setHex(P[k]); });
    MAT.screen.emissive.setHex(P.screen);
    tracked.forEach(function (m) { m.color.setHex(P[m.userData.key]); });
    Object.keys(tintMats).forEach(function (k) { tintMats[k].color.setHex(P.tints[k]); });
    zoneEdgeMat.color.setHex(P.zoneEdge);
    gridMat.color.setHex(P.grid);
    pathCornerMat.color.setHex(P.path);
    drawPathTexture();
    pathMats.forEach(function (m) { m.map.needsUpdate = true; });
    highlight.material.color.setHex(P.highlight);
    colorLoads();
    var bg = getComputedStyle(document.body).backgroundColor;
    scene.background = new THREE.Color(bg);
    shadowCatcher.material.opacity = currentTheme() === 'dark' ? 0.25 : 0.1;
    hemi.intensity = currentTheme() === 'dark' ? 0.6 : 0.66;
    swatches();
  }

  // ---------------------------------------------------------------------------
  // Destaque, dica e seleção
  // ---------------------------------------------------------------------------
  var highlight = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(1, 1, 1).translate(0, 0.5, 0)),
    new THREE.LineBasicMaterial({ color: P.highlight, transparent: true, opacity: 0.95, depthTest: false }));
  highlight.renderOrder = 10;
  highlight.visible = false;
  scene.add(highlight);

  var tip = document.getElementById('tip');
  var raycaster = new THREE.Raycaster();
  var ndc = new THREE.Vector2();
  var pointer = { x: 0, y: 0, inside: false, dirty: false };
  var hovered = null;
  var tmpBox = new THREE.Box3(), tmpV = new THREE.Vector3(), tmpC = new THREE.Vector3();

  function shown(obj) {
    for (var o = obj; o; o = o.parent) if (!o.visible) return false;
    return true;
  }
  function pick() {
    var rect = canvas.getBoundingClientRect();
    ndc.set(((pointer.x - rect.left) / rect.width) * 2 - 1, -((pointer.y - rect.top) / rect.height) * 2 + 1);
    raycaster.setFromCamera(ndc, camera);
    var hits = raycaster.intersectObjects(pickables, false);
    for (var i = 0; i < hits.length; i++) if (shown(hits[i].object)) return hits[i].object;
    return null;
  }
  function updateHover() {
    var obj = pointer.inside && !state.tour ? pick() : null;
    hovered = obj;
    if (!obj) { highlight.visible = false; tip.hidden = true; canvas.style.cursor = ''; return; }
    tmpBox.setFromObject(obj);
    tmpBox.getSize(tmpV); tmpBox.getCenter(tmpC);
    highlight.scale.set(Math.max(tmpV.x, 0.05) + 0.1, Math.max(tmpV.y, 0.05), Math.max(tmpV.z, 0.05) + 0.1);
    highlight.position.set(tmpC.x, tmpBox.min.y, tmpC.z);
    highlight.visible = true;
    tip.innerHTML = '';
    var b = document.createElement('b'); b.textContent = obj.userData.title;
    var s = document.createElement('span'); s.textContent = obj.userData.info;
    tip.appendChild(b); tip.appendChild(s);
    tip.hidden = false;
    var rect = document.getElementById('app').getBoundingClientRect();
    var tx = pointer.x - rect.left + 16, ty = pointer.y - rect.top + 16;
    if (tx + 270 > rect.width) tx = pointer.x - rect.left - 276;
    if (ty + 90 > rect.height) ty = pointer.y - rect.top - 90;
    tip.style.transform = 'translate(' + tx + 'px,' + ty + 'px)';
    canvas.style.cursor = 'pointer';
  }

  var downAt = null;
  canvas.addEventListener('pointermove', function (e) {
    pointer.x = e.clientX; pointer.y = e.clientY; pointer.inside = e.pointerType === 'mouse'; pointer.dirty = true;
  });
  canvas.addEventListener('pointerleave', function () { pointer.inside = false; pointer.dirty = true; });
  canvas.addEventListener('pointerdown', function (e) { downAt = { x: e.clientX, y: e.clientY, t: performance.now() }; });
  canvas.addEventListener('pointerup', function (e) {
    if (!downAt || state.tour) return;
    var moved = Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y);
    if (moved > 5 || performance.now() - downAt.t > 450) return;
    pointer.x = e.clientX; pointer.y = e.clientY;
    var obj = pick();
    if (!obj) return;
    tmpBox.setFromObject(obj);
    tmpBox.getSize(tmpV); tmpBox.getCenter(tmpC);
    var dist = Math.max(tmpV.x, tmpV.z, 5) * 1.1 + 3;
    var dir = new THREE.Vector3().subVectors(camera.position, controls.target).normalize();
    if (dir.y < 0.45) { dir.y = 0.45; dir.normalize(); }
    if (dir.y > 0.85) dir.set(0.4, 0.72, 0.56).normalize(); // vindo da vista de cima: inclina para ver em 3D
    // Áreas junto às paredes: a câmera fica do lado de dentro do galpão, olhando para a parede
    var inward = new THREE.Vector2(-tmpC.x, -tmpC.z);
    if (inward.length() > 8) {
      inward.normalize();
      var hz = Math.hypot(dir.x, dir.z);
      dir.set(inward.x * hz, dir.y, inward.y * hz).normalize();
    }
    var target = new THREE.Vector3(tmpC.x, Math.min(tmpC.y, 1.5), tmpC.z);
    flyTo(target.clone().addScaledVector(dir, dist), target);
    setPressed(null);
  });

  // ---------------------------------------------------------------------------
  // Vistas e animação de câmera
  // ---------------------------------------------------------------------------
  var fly = null;
  function ease(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
  function flyTo(pos, target, dur) {
    dur = reduceMotion ? 0 : (dur === undefined ? 1.1 : dur);
    if (dur === 0) { camera.position.copy(pos); controls.target.copy(target); controls.update(); fly = null; return; }
    fly = { p0: camera.position.clone(), t0: controls.target.clone(), p1: pos, t1: target, start: performance.now(), dur: dur };
  }
  function topDistance() {
    var vf = THREE.MathUtils.degToRad(camera.fov);
    var needH = (D + 6) / (2 * Math.tan(vf / 2));
    var needW = (W + 6) / (2 * Math.tan(vf / 2) * camera.aspect);
    return Math.max(needH, needW);
  }
  var VIEWS = {
    overview: function () {
      var t = new THREE.Vector3(0, 0, 1);
      var dir = new THREE.Vector3(0.42, 0.72, 0.56).normalize();
      return { pos: t.clone().addScaledVector(dir, topDistance() * 1.08), target: t };
    },
    top: function () { return { pos: new THREE.Vector3(0, topDistance(), 0.01), target: new THREE.Vector3(0, 0, 0) }; },
    storage: function () {
      var t = new THREE.Vector3(X(1207), 2, Z(1270));
      return { pos: t.clone().add(new THREE.Vector3(-13, 17, 21)), target: t };
    },
    offices: function () {
      var t = new THREE.Vector3(X(1820), 0, Z(2930));
      return { pos: t.clone().add(new THREE.Vector3(5, 15, 15)), target: t };
    }
  };
  function setPressed(view) {
    document.querySelectorAll('.views [data-view]').forEach(function (b) {
      if (b.dataset.view !== 'tour') b.setAttribute('aria-pressed', String(b.dataset.view === view));
    });
  }
  function goView(name, instant) {
    if (name === 'tour') { startTour(); return; }
    if (state.tour) stopTour(true);
    var v = VIEWS[name]();
    flyTo(v.pos, v.target, instant ? 0 : undefined);
    setPressed(name);
  }
  document.querySelectorAll('.views [data-view]').forEach(function (b) {
    b.addEventListener('click', function () { goView(b.dataset.view); });
  });

  // ---------------------------------------------------------------------------
  // Percurso guiado pelo caminho seguro
  // ---------------------------------------------------------------------------
  var hud = document.getElementById('hud'), hudWhere = document.getElementById('hud-where');
  var hudBar = document.getElementById('hud-bar'), hudMeta = document.getElementById('hud-meta');
  var tourStartS = 0, camGoal = new THREE.Vector3(), lookGoal = new THREE.Vector3(), lookCur = new THREE.Vector3();

  function startTour() {
    if (state.tour) return;
    state.tour = true;
    fly = null;
    walkS = 0; tourStartS = 0;
    controls.enabled = false;
    G.path.visible = true;
    document.getElementById('lyr-path').checked = true;
    hud.hidden = false;
    highlight.visible = false; tip.hidden = true;
    setPressed(null);
    tourAt(0, walkPos, walkDir);
    lookCur.copy(walkPos).setY(1.3);
  }
  function stopTour(silent) {
    if (!state.tour) return;
    state.tour = false;
    controls.enabled = true;
    hud.hidden = true;
    controls.target.copy(lookCur);
    controls.update();
    if (!silent) goView('overview');
  }
  document.getElementById('hud-stop').addEventListener('click', function () { stopTour(false); });
  window.addEventListener('keydown', function (e) { if (e.key === 'Escape' && state.tour) stopTour(false); });

  // ---------------------------------------------------------------------------
  // Resumo (carimbo)
  // ---------------------------------------------------------------------------
  function fmt(n, d) { return n.toLocaleString('pt-BR', { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 }); }
  var totalPositions = R.rows.reduce(function (s, r) { return s + r.positions; }, 0);
  document.getElementById('st-area').innerHTML = '≈ ' + fmt(Math.round(W * D / 10) * 10) + ' <small>m²</small>';
  document.getElementById('st-dims').innerHTML = fmt(W) + ' × ' + fmt(D) + ' <small>m</small>';
  document.getElementById('st-pos').textContent = fmt(totalPositions);
  document.getElementById('st-rows').innerHTML = R.rows.length + ' <small>fileiras duplas</small>';
  document.getElementById('st-path').innerHTML = '≈ ' + fmt(Math.round(pathLength)) + ' <small>m de faixa</small><small class="line">Volta completa pelo percurso: ' + fmt(Math.round(tourLen)) + ' m</small>';

  // ---------------------------------------------------------------------------
  // Loop principal
  // ---------------------------------------------------------------------------
  function resize() {
    var w = canvas.clientWidth, h = canvas.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  var labelV = new THREE.Vector3();
  function updateLabels() {
    var w = canvas.clientWidth, h = canvas.clientHeight;
    var hideAll = !state.labels || state.tour;
    labels.forEach(function (l) {
      var show = !hideAll && shown(l.group);
      if (show && l.minor) show = camera.position.distanceTo(l.pos) < 42;
      if (show) {
        labelV.copy(l.pos).project(camera);
        show = labelV.z < 1 && Math.abs(labelV.x) < 1.1 && Math.abs(labelV.y) < 1.1;
      }
      if (show !== l.shown) { l.el.hidden = !show; l.shown = show; }
      if (show) {
        var x = (labelV.x * 0.5 + 0.5) * w, y = (-labelV.y * 0.5 + 0.5) * h;
        l.el.style.transform = 'translate(-50%,-100%) translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px)';
      }
    });
  }

  var clock = new THREE.Clock(), elapsed = 0;
  var camOffset = new THREE.Vector3();
  function frame() {
    var dt = Math.min(clock.getDelta(), 0.25);
    elapsed += dt;

    // pedestre caminhando pelo percurso
    var speed = state.tour ? 2.6 : 1.3;
    if (!reduceMotion || state.tour) walkS += dt * speed;
    walkSeg = tourAt(walkS, walkPos, walkDir);
    walker.position.copy(walkPos);
    walker.rotation.y = Math.atan2(-walkDir.z, walkDir.x);
    animateWalk(walker, walkS / 1.45 * Math.PI * 2);
    ring.scale.setScalar(1 + 0.12 * Math.sin(elapsed * 4));

    // empilhadeiras indo e voltando no corredor
    if (!reduceMotion) lifts.forEach(function (f) {
      var t = 0.5 - 0.5 * Math.cos(elapsed * 0.22 + f.phase * Math.PI * 2);
      f.g.position.x = f.a + (f.b - f.a) * t;
    });

    if (state.tour) {
      camOffset.copy(walkDir).multiplyScalar(-8);
      camGoal.copy(walkPos).add(camOffset).setY(4.3);
      lookGoal.copy(walkPos).addScaledVector(walkDir, 7).setY(0.9);
      var k = 1 - Math.exp(-dt * 2.4);
      camera.position.lerp(camGoal, k);
      lookCur.lerp(lookGoal, k);
      camera.lookAt(lookCur);
      var done = walkS - tourStartS;
      hudWhere.textContent = tour[walkSeg].name;
      hudBar.style.width = Math.min(100, (done / tourLen) * 100).toFixed(1) + '%';
      hudMeta.textContent = fmt(Math.min(done, tourLen)) + ' de ' + fmt(tourLen) + ' m';
      if (done >= tourLen) stopTour(false);
    } else if (fly) {
      var fk = Math.min(1, (performance.now() - fly.start) / 1000 / fly.dur);
      var e = ease(fk);
      camera.position.lerpVectors(fly.p0, fly.p1, e);
      controls.target.lerpVectors(fly.t0, fly.t1, e);
      if (fk >= 1) fly = null;
      controls.update();
    } else {
      controls.update();
    }

    if (pointer.dirty) { pointer.dirty = false; updateHover(); }
    renderer.render(scene, camera);
    updateLabels();
    requestAnimationFrame(frame);
  }

  applyTheme();
  var mq = window.matchMedia('(prefers-color-scheme: dark)');
  if (mq.addEventListener) mq.addEventListener('change', applyTheme);
  new MutationObserver(applyTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  goView('overview', true);
  statusEl.hidden = true;
  requestAnimationFrame(frame);
})();
</script>
